<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bệnh Nhân - Bảng Điều Khiển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-heart-pulse me-2"></i>Smart Healthcare - Bệnh Nhân</a>
        <button class="btn btn-light btn-sm fw-bold text-primary" onclick="logout()"><i class="fa-solid fa-sign-out-alt me-1"></i>Đăng Xuất</button>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-lg-7 mb-4">
            <div class="card shadow-sm border-0 rounded-3 mb-4">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="mb-0 text-primary fw-bold"><i class="fa-solid fa-calendar-plus me-2"></i>Đăng Ký Lịch Hẹn Khám Hộ</h5>
                </div>
                <div class="card-body p-4">
                    <div id="bookingAlert" class="alert d-none"></div>
                    <form id="appointmentForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">1. Chọn Chuyên Khoa Khám</label>
                            <select class="form-select" id="specialtySelect" required onchange="loadDoctorsBySpecialty()">
                                <option value="">-- Đang tải dữ liệu chuyên khoa... --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">2. Chọn Bác Sĩ Phụ Trách</label>
                            <select class="form-select" id="doctorSelect" required>
                                <option value="">-- Vui lòng chọn chuyên khoa trước --</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">3. Chọn Ngày Hẹn</label>
                                <input type="date" class="form-control" id="appDate" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-semibold">4. Khung Giờ Khám</label>
                                <select class="form-select" id="appTime" required>
                                    <option value="08:00:00">08:00 Sáng</option>
                                    <option value="09:00:00">09:00 Sáng</option>
                                    <option value="10:00:00">10:00 Sáng</option>
                                    <option value="14:00:00">14:00 Chiều</option>
                                    <option value="15:00:00">15:00 Chiều</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Ghi chú triệu chứng lâm sàng</label>
                            <textarea class="form-control" id="symptoms" rows="3" required placeholder="Nhập các biểu hiện mệt mỏi, đau nhức hiện tại..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Xác Nhận Đặt Lịch Hẹn</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3">
                    <h6 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-clock-history me-2 text-secondary"></i>Lịch Sử Các Lần Khám Bệnh (CORE-07)</h6>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-center">
                            <thead class="table-light">
                            <tr>
                                <th>Ngày Khám</th>
                                <th>Bác Sĩ</th>
                                <th>Triệu Chứng</th>
                                <th>Trạng Thái</th>
                            </tr>
                            </thead>
                            <tbody id="historyTableBody">
                            <tr><td colspan="4" class="text-muted p-3">Chưa có lịch sử khám bệnh nào.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5 mb-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="mb-0 text-secondary fw-bold"><i class="fa-solid fa-user-gear me-2"></i>Hồ Sơ Cá Nhân (CORE-03)</h5>
                </div>
                <div class="card-body p-4">
                    <div id="profileAlert" class="alert d-none"></div>
                    <form id="profileForm">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">Tên tài khoản</label>
                            <input type="text" class="form-control bg-light" id="username" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ và Tên</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Địa chỉ thường trú</label>
                            <input type="text" class="form-control" id="address">
                        </div>
                        <button type="submit" class="btn btn-outline-secondary w-100 fw-bold">Đồng Bộ Cập Nhật Hồ Sơ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        // 1. Tải thông tin hồ sơ
        fetch('/api/v1/users/profile')
            .then(res => res.json())
            .then(data => {
                document.getElementById('username').value = data.username || '';
                document.getElementById('fullName').value = data.fullName || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('address').value = data.address || '';
            });

        // 2. TỰ ĐỘNG TẢI DANH SÁCH CHUYÊN KHOA TỪ DATABASE
        fetch('/api/v1/patient/specialties')
            .then(res => res.json())
            .then(data => {
                const specSelect = document.getElementById('specialtySelect');
                specSelect.innerHTML = '<option value="">-- Chọn chuyên khoa --</option>';
                data.forEach(spec => {
                    specSelect.innerHTML += `<option value="${spec.id}">${spec.name}</option>`;
                });
            });

        loadAppointmentHistory();
    };

    function loadDoctorsBySpecialty() {
        const specId = document.getElementById('specialtySelect').value;
        const docSelect = document.getElementById('doctorSelect');
        if(!specId) { docSelect.innerHTML = '<option value="">-- Chọn chuyên khoa trước --</option>'; return; }

        docSelect.innerHTML = '<option value="">-- Đang tải danh sách bác sĩ --</option>';
        fetch('/api/v1/patient/doctors?specialtyId=' + specId)
            .then(res => res.json())
            .then(data => {
                docSelect.innerHTML = '';
                if(data.length === 0) {
                    docSelect.innerHTML = '<option value="">Không có bác sĩ nào trực thuộc</option>';
                    return;
                }
                data.forEach(doc => {
                    docSelect.innerHTML += `<option value="${doc.id}">BS. ${doc.fullName} (${doc.qualification})</option>`;
                });
            });
    }

    document.getElementById('appointmentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('bookingAlert');
        const payload = {
            doctorId: document.getElementById('doctorSelect').value,
            appointmentDate: document.getElementById('appDate').value,
            appointmentTime: document.getElementById('appTime').value,
            symptoms: document.getElementById('symptoms').value
        };

        fetch('/api/v1/patient/appointments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(async res => {
                alertBox.classList.remove('d-none');
                if(res.ok) {
                    alertBox.className = "alert alert-success";
                    alertBox.innerText = "Đặt lịch thành công! Đang ở trạng thái Chờ khám.";
                    document.getElementById('appointmentForm').reset();
                    loadAppointmentHistory();
                } else {
                    const err = await res.json();
                    alertBox.className = "alert alert-danger";
                    alertBox.innerText = err.error || "Khung giờ này đã bị trùng lịch! Vui lòng chọn giờ khác.";
                }
            });
    });

    function loadAppointmentHistory() {
        // Tích hợp API lấy lịch sử ở CORE-07 sau này
    }

    function logout() {
        fetch('/api/v1/auth/logout', { method: 'POST' }).then(() => window.location.href = '/login');
    }
</script>
</body>
</html>
