<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Quản Lý Thuốc</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card-stats { border-radius: 12px; transition: transform 0.2s; }
        .card-stats:hover { transform: translateY(-3px); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-sliders me-2 text-danger"></i>Smart Healthcare - ADMIN</a>
        <button class="btn btn-danger btn-sm fw-bold" onclick="logout()"><i class="fa-solid fa-sign-out-alt me-1"></i>Đăng Xuất</button>
    </div>
</nav>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-6 mb-2">
            <div class="card card-stats bg-white border-0 shadow-sm p-3">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="text-muted mb-1">Tổng Danh Mục Thuốc Active</h6>
                        <h3 class="fw-bold text-primary mb-0" id="totalMedCount">0</h3>
                    </div>
                    <div class="p-3 bg-primary bg-opacity-10 rounded-3 text-primary">
                        <i class="fa-solid fa-pills fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-2">
            <div class="card card-stats bg-white border-0 shadow-sm p-3">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="text-muted mb-1">Cảnh Báo Thuốc Sắp Hết (Tồn <= 10)</h6>
                        <h3 class="fw-bold text-danger mb-0" id="lowStockCount">0</h3>
                    </div>
                    <div class="p-3 bg-danger bg-opacity-10 rounded-3 text-danger">
                        <i class="fa-solid fa-triangle-exclamation fa-2x"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
            <h5 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-warehouse text-success me-2"></i>Kho Thuốc Hệ Thống</h5>
            <button class="btn btn-success btn-sm fw-bold" onclick="showAddModal()">+ Nhập Thuốc Mới</button>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover text-center align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Tên Thuốc</th>
                    <th>Nhóm Thuốc</th>
                    <th>Đơn Vị</th>
                    <th>Đơn Giá</th>
                    <th>Số Lượng Tồn</th>
                    <th>Thao Tác</th>
                </tr>
                </thead>
                <tbody id="medicineTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="medicineModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold" id="modalTitle">Thêm Thuốc Mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="medicineForm">
                <div class="modal-body">
                    <div id="modalAlert" class="alert d-none"></div>
                    <input type="hidden" id="medId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên Thuốc</label>
                        <input type="text" class="form-control" id="medName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nhóm Thuốc Điều Trị</label>
                        <input type="text" class="form-control" id="medCat" required placeholder="VD: Kháng sinh, Giảm đau...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Đơn Vị Tính</label>
                        <input type="text" class="form-control" id="medUnit" required placeholder="VD: Viên, Vỉ, Chai...">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-2">
                            <label class="form-label fw-semibold">Đơn Giá (VNĐ)</label>
                            <input type="number" class="form-control" id="medPrice" required min="0">
                        </div>
                        <div class="col-6 mb-2">
                            <label class="form-label fw-semibold">Số Lượng Tồn</label>
                            <input type="number" class="form-control" id="medQty" required min="0">
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-success fw-bold">Lưu Thông Tin</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let medicineModal;

    window.onload = function() {
        medicineModal = new bootstrap.Modal(document.getElementById('medicineModal'));
        loadMedicines();
    };

    function loadMedicines() {
        fetch('/api/v1/admin/medicines')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('medicineTableBody');
                tbody.innerHTML = '';
                let lowStock = 0;

                data.forEach(med => {
                    if(med.quantityInStock <= 10) lowStock++;
                    tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold">${med.id}</td>
                        <td class="text-start fw-bold">${med.medicineName}</td>
                        <td><span class="badge bg-light text-secondary">${med.category}</span></td>
                        <td>${med.unit}</td>
                        <td class="text-danger fw-semibold">${med.price.toLocaleString('vi-VN')} đ</td>
                        <td><span class="badge ${med.quantityInStock > 10 ? 'bg-success' : 'bg-danger'}">${med.quantityInStock}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary py-0" onclick="showEditModal(${med.id}, '${med.medicineName}', '${med.category}', '${med.unit}', ${med.price}, ${med.quantityInStock})">Sửa</button>
                            <button class="btn btn-sm btn-outline-danger py-0 ms-1" onclick="deleteMedicine(${med.id})">Xóa</button>
                        </td>
                    </tr>`;
                });
                document.getElementById('totalMedCount').innerText = data.length;
                document.getElementById('lowStockCount').innerText = lowStock;
            });
    }

    function showAddModal() {
        document.getElementById('medicineForm').reset();
        document.getElementById('medId').value = '';
        document.getElementById('modalTitle').innerText = 'Thêm Thuốc Mới';
        document.getElementById('modalAlert').classList.add('d-none');
        medicineModal.show();
    }

    function showEditModal(id, name, cat, unit, price, qty) {
        document.getElementById('modalAlert').classList.add('d-none');
        document.getElementById('modalTitle').innerText = 'Chỉnh Sửa Thuốc (ID: ' + id + ')';
        document.getElementById('medId').value = id;
        document.getElementById('medName').value = name;
        document.getElementById('medCat').value = cat;
        document.getElementById('medUnit').value = unit;
        document.getElementById('medPrice').value = price;
        document.getElementById('medQty').value = qty;
        medicineModal.show();
    }

    document.getElementById('medicineForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('medId').value;
        const payload = {
            medicineName: document.getElementById('medName').value,
            category: document.getElementById('medCat').value,
            unit: document.getElementById('medUnit').value,
            price: document.getElementById('medPrice').value,
            quantityInStock: document.getElementById('medQty').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? '/api/v1/admin/medicines/' + id : '/api/v1/admin/medicines';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(async response => {
            if (response.ok) {
                medicineModal.hide();
                loadMedicines();
            } else {
                const text = await response.text();
                const alertBox = document.getElementById('modalAlert');
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = text;
                alertBox.classList.remove('d-none');
            }
        });
    });

    function deleteMedicine(id) {
        if(confirm("Bạn có chắc chắn muốn xóa thuốc này?")) {
            fetch('/api/v1/admin/medicines/' + id, { method: 'DELETE' }).then(() => loadMedicines());
        }
    }

    // Đăng xuất
    function logout() {
        fetch('/api/v1/auth/logout', { method: 'POST' }).then(() => window.location.href = '/login');
    }
</script>
</body>
</html>
