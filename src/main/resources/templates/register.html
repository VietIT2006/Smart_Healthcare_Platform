<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - Smart Healthcare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .reg-container { max-width: 450px; margin-top: 80px; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

<div class="container reg-container">
    <div class="card p-4">
        <h3 class="text-center mb-4 text-primary fw-bold">Đăng Ký Thành Viên</h3>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Tên đăng nhập</label>
                <input type="text" class="form-control" id="username" required placeholder="Tối thiểu 4 ký tự...">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Mật khẩu</label>
                <input type="password" class="form-control" id="password" required placeholder="Tối thiểu 6 ký tự...">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Vai trò phân hệ</label>
                <select class="form-select" id="role">
                    <option value="PATIENT">Bệnh nhân (Patient)</option>
                    <option value="DOCTOR">Bác sĩ (Doctor)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Kích Hoạt Tài Khoản</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Đã có tài khoản? <a href="/login" class="text-primary fw-semibold text-decoration-none">Đăng nhập</a></small>
        </div>
    </div>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const roleVal = document.getElementById('role').value;
        const alertBox = document.getElementById('alertBox');

        fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass, role: roleVal })
        })
            .then(async response => {
                const data = await response.json();
                alertBox.classList.remove('d-none');
                if (response.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = "Tạo tài khoản bảo mật thành công! Đang chuyển hướng...";
                    setTimeout(() => { window.location.href = '/login'; }, 1200);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = data.message || "Tên tài khoản đã tồn tại hoặc dữ liệu lỗi!";
                }
            });
    });
</script>
</body>
</html>
