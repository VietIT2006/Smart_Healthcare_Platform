<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bác Sĩ - Smart Healthcare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-success mb-4 shadow">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-stethoscope me-2"></i>Hệ Thống Khám Bệnh Lâm Sàng</a>
        <div>
            <a href="/profile" class="btn btn-outline-light btn-sm me-2"><i class="fa-solid fa-user-doctor me-1"></i>Hồ Sơ Cá Nhân</a>
            <button class="btn btn-danger btn-sm fw-bold" onclick="logout()"><i class="fa-solid fa-sign-out-alt me-1"></i>Đăng Xuất</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0 rounded-3 h-100">
                <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 fw-bold text-success"><i class="fa-solid fa-users-viewfinder me-2"></i>Hàng Đợi Khám Bệnh</h5>
                    <button class="btn btn-sm btn-outline-success" onclick="loadQueue()"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush" id="queueList">
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8 mb-4">

            <div class="card shadow-sm border-0 rounded-3 h-100" id="welcomeCard">
                <div class="card-body d-flex flex-column justify-content-center align-items-center text-muted">
                    <i class="fa-solid fa-user-nurse fa-4x mb-3 text-success opacity-50"></i>
                    <h5>Vui lòng chọn một bệnh nhân ở cột bên trái để bắt đầu lập ca khám bệnh.</h5>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-3 h-100 d-none" id="examCard">
                <div class="card-header bg-white py-3 border-bottom text-primary fw-bold">
                    <i class="fa-solid fa-file-medical me-2"></i>Nội Dung Khám & Kê Đơn Thuốc
                </div>
                <div class="card-body p-4">
                    <form id="examForm">
                        <input type="hidden" id="selectedAppId">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Triệu chứng lâm sàng (Bệnh nhân tự khai)</label>
                            <textarea class="form-control bg-light" id="patientSymptoms" rows="2" readonly></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-danger">Kết Luận Chẩn Đoán Bệnh Lý *</label>
                            <textarea class="form-control" id="diagnosis" rows="3" placeholder="Nhập kết quả chẩn đoán chi tiết..." required></textarea>
                        </div>

                        <div class="border p-3 rounded bg-light mb-4 shadow-sm">
                            <h6 class="fw-bold text-success mb-3"><i class="fa-solid fa-pills me-2"></i>Kê Đơn Thuốc Điều Trị</h6>

                            <div class="row g-2 mb-3 align-items-end">
                                <div class="col-md-7">
                                    <label class="small fw-bold">Chọn danh mục thuốc</label>
                                    <select class="form-select" id="medSelect"></select>
                                </div>
                                <div class="col-md-3">
                                    <label class="small fw-bold">Số lượng cấp</label>
                                    <input type="number" class="form-control" id="medQty" min="1" value="1">
                                </div>
                                <div class="col-md-2">
                                    <button type="button" class="btn btn-primary w-100 fw-bold" onclick="addMedicineToPrescription()"><i class="fa-solid fa-plus me-1"></i>Kê</button>
                                </div>
                            </div>

                            <table class="table table-sm table-bordered text-center bg-white align-middle mb-0">
                                <thead class="table-success">
                                <tr><th>Tên Thuốc</th><th>Số Lượng</th><th>Hành Động</th></tr>
                                </thead>
                                <tbody id="prescriptionBody"></tbody>
                            </table>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold fs-5 shadow"><i class="fa-solid fa-paper-plane me-2"></i>Hoàn Thành & Gửi Đơn Thuốc Xuống Quầy</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let prescriptionList = []; // Mảng tạm lưu các vị thuốc trong đơn hiện tại

    window.onload = function() {
        loadQueue();
        loadMedicines();
    };

    function loadQueue() {
        fetch('/api/v1/doctor/appointments/queue')
            .then(res => res.json())
            .then(data => {
                const queueList = document.getElementById('queueList');
                queueList.innerHTML = '';
                if (data.length === 0) {
                    queueList.innerHTML = '<div class="text-center p-4 text-muted"><i class="fa-solid fa-mug-hot fa-2x mb-2"></i><br>Hàng đợi trống. Chưa có lịch đặt.</div>';
                    return;
                }
                data.forEach(app => {
                    queueList.innerHTML += `
                    <button class="list-group-item list-group-item-action py-3 border-bottom" onclick="selectAppointment(${app.id}, '${app.symptoms}')">
                        <div class="d-flex w-100 justify-content-between align-items-center">
                            <h6 class="mb-1 fw-bold text-primary"><i class="fa-solid fa-hospital-user me-2"></i>${app.patientName}</h6>
                            <span class="badge bg-danger rounded-pill">${app.time}</span>
                        </div>
                        <p class="mb-1 small text-secondary mt-2"><b>Triệu chứng:</b> ${app.symptoms}</p>
                        <small class="text-muted"><i class="fa-regular fa-calendar me-1"></i>${app.date}</small>
                    </button>`;
                });
            });
    }

    function selectAppointment(id, symptoms) {
        document.getElementById('selectedAppId').value = id;
        document.getElementById('patientSymptoms').value = symptoms;
        document.getElementById('welcomeCard').classList.add('d-none');
        document.getElementById('examCard').classList.remove('d-none');

        document.getElementById('diagnosis').value = '';
        prescriptionList = [];
        renderPrescriptionTable();
    }

    // ĐƯỜNG DẪN ĐÃ ĐƯỢC FIX LỖI 403 (GỌI QUA API ĐỘC LẬP CỦA BÁC SĨ)
    function loadMedicines() {
        fetch('/api/v1/doctor/appointments/medicines')
            .then(res => res.json())
            .then(data => {
                const medSelect = document.getElementById('medSelect');
                medSelect.innerHTML = '<option value="">-- Chọn thuốc điều trị --</option>';
                data.forEach(med => {
                    medSelect.innerHTML += `<option value="${med.id}" data-name="${med.medicineName}" data-stock="${med.quantityInStock}">${med.medicineName} (Tồn kho: ${med.quantityInStock})</option>`;
                });
            }).catch(err => console.log("Không thể nạp danh sách thuốc", err));
    }

    function addMedicineToPrescription() {
        const medSelect = document.getElementById('medSelect');
        const medId = medSelect.value;
        const qty = parseInt(document.getElementById('medQty').value);

        if (!medId || qty <= 0) {
            alert("Vui lòng lựa chọn loại thuốc và số lượng hợp lệ!");
            return;
        }

        const selectedOption = medSelect.options[medSelect.selectedIndex];
        const medName = selectedOption.getAttribute('data-name');
        const stock = parseInt(selectedOption.getAttribute('data-stock'));

        if (qty > stock) {
            alert(`Lỗi nghiêm trọng: Kho thuốc chỉ còn ${stock} đơn vị. Không đủ cấp!`);
            return;
        }

        const existingIndex = prescriptionList.findIndex(p => p.medicineId == medId);
        if (existingIndex >= 0) {
            if (prescriptionList[existingIndex].quantity + qty > stock) {
                alert(`Lỗi: Tổng số kê trong đơn vượt quá số lượng tồn hiện thực trong kho (${stock})!`);
                return;
            }
            prescriptionList[existingIndex].quantity += qty;
        } else {
            prescriptionList.push({ medicineId: medId, name: medName, quantity: qty });
        }
        renderPrescriptionTable();
    }

    function removeMedicine(medId) {
        prescriptionList = prescriptionList.filter(p => p.medicineId != medId);
        renderPrescriptionTable();
    }

    function renderPrescriptionTable() {
        const tbody = document.getElementById('prescriptionBody');
        tbody.innerHTML = '';
        prescriptionList.forEach(p => {
            tbody.innerHTML += `
            <tr>
                <td class="fw-semibold text-start">${p.name}</td>
                <td class="fw-bold text-primary">${p.quantity}</td>
                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeMedicine(${p.medicineId})"><i class="fa-solid fa-trash-can"></i></button></td>
            </tr>`;
        });
    }

    document.getElementById('examForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const payload = {
            appointmentId: document.getElementById('selectedAppId').value,
            diagnosis: document.getElementById('diagnosis').value,
            prescriptions: prescriptionList
        };

        fetch('/api/v1/doctor/appointments/complete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
            .then(async res => {
                if (res.ok) {
                    alert("🎉 Ca khám hoàn tất! Đơn thuốc đã được luân chuyển xuống quầy cấp phát của Admin chờ duyệt.");
                    document.getElementById('examCard').classList.add('d-none');
                    document.getElementById('welcomeCard').classList.remove('d-none');
                    loadQueue();
                    loadMedicines();
                } else {
                    const err = await res.text(); alert("Có lỗi xảy ra: " + err);
                }
            });
    });

    function logout() {
        fetch('/api/v1/auth/logout', { method: 'POST' }).then(() => window.location.href = '/login');
    }
</script>
</body>
</html>
