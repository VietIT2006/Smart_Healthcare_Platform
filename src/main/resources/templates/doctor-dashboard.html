<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bác Sĩ - Phòng Khám Lâm Sàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-user-doctor me-2 text-success"></i>Smart Healthcare - Bác Sĩ</a>
        <button class="btn btn-danger btn-sm fw-bold" onclick="logout()"><i class="fa-solid fa-sign-out-alt me-1"></i>Đăng Xuất</button>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3 border-bottom">
                    <h6 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-folder-open me-2 text-warning"></i>Hàng Đợi Chờ Khám</h6>
                </div>
                <div class="list-group list-group-flush" id="queueList">
                    <div class="text-center p-4 text-muted">Đang tải danh sách chờ...</div>
                </div>
            </div>
        </div>

        <div class="col-md-8 mb-4">
            <div class="card shadow-sm border-0 rounded-3 d-none" id="examCard">
                <div class="card-header bg-success text-white py-3">
                    <h5 class="mb-0 fw-bold"><i class="fa-solid fa-notes-medical me-2"></i>Tiến Trình Chẩn Đoán & Kê Đơn</h5>
                </div>
                <div class="card-body p-4">
                    <form id="examForm">
                        <input type="hidden" id="selectedAppId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Lý do đến khám (Triệu chứng)</label>
                            <input type="text" class="form-control bg-light" id="patientSymptoms" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chẩn đoán bệnh kết luận</label>
                            <textarea class="form-control" id="diagnosis" rows="2" required placeholder="Nhập kết luận bệnh án..."></textarea>
                        </div>

                        <div class="mb-3 border p-3 rounded bg-white">
                            <label class="form-label fw-bold text-success">Kê đơn thuốc điều trị (CORE-04 liên thông)</label>
                            <div class="row g-2">
                                <div class="col-7">
                                    <select class="form-select" id="medSelect"></select>
                                </div>
                                <div class="col-3">
                                    <input type="number" class="form-control" id="medQty" value="1" min="1">
                                </div>
                                <div class="col-2">
                                    <button type="button" class="btn btn-success w-100" onclick="addMedicineToPrescription()">+</button>
                                </div>
                            </div>

                            <table class="table table-sm table-bordered mt-3 text-center align-middle">
                                <thead class="table-light">
                                <tr><th>Biệt dược</th><th>Số lượng</th><th>Xóa</th></tr>
                                </thead>
                                <tbody id="prescriptionBody"></tbody>
                            </table>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Hoàn Thành Ca Khám & Lưu Toàn Vẹn Dữ Liệu</button>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm p-5 text-center text-muted" id="welcomeCard">
                <i class="fa-solid fa-stethoscope fa-3x mb-3 text-secondary"></i>
                <h5>Vui lòng chọn một ca bệnh ở danh sách chờ bên trái để bắt đầu khám.</h5>
            </div>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        loadQueue();
    };

    // Gọi API để nạp danh sách chờ khám
    function loadQueue() {
        fetch('/api/v1/doctor/appointments/queue')
            .then(res => res.json())
            .then(data => {
                const queueList = document.getElementById('queueList');
                queueList.innerHTML = '';

                if (data.length === 0) {
                    queueList.innerHTML = '<div class="text-center p-4 text-muted"><i class="fa-solid fa-mug-hot fa-2x mb-2"></i><br>Chưa có bệnh nhân nào đặt lịch.</div>';
                    return;
                }

                data.forEach(app => {
                    queueList.innerHTML += `
                    <button class="list-group-item list-group-item-action py-3 border-bottom" onclick="selectAppointment(${app.id}, '${app.symptoms}')">
                        <div class="d-flex w-100 justify-content-between align-items-center">
                            <h6 class="mb-1 fw-bold text-primary"><i class="fa-solid fa-hospital-user me-2"></i>${app.patientName}</h6>
                            <span class="badge bg-danger rounded-pill">${app.time}</span>
                        </div>
                        <p class="mb-1 small text-secondary mt-2"><b>Triệu chứng:</b> ${app.symptoms}</p>
                        <small class="text-muted"><i class="fa-regular fa-calendar me-1"></i>${app.date}</small>
                    </button>
                    `;
                });
            });
    }

    // Khi bác sĩ click vào 1 bệnh nhân
    function selectAppointment(id, symptoms) {
        document.getElementById('selectedAppId').value = id;
        document.getElementById('patientSymptoms').value = symptoms;

        // Hiện form chẩn đoán bệnh
        document.getElementById('welcomeCard').classList.add('d-none');
        document.getElementById('examCard').classList.remove('d-none');
    }

    function logout() {
        fetch('/api/v1/auth/logout', { method: 'POST' }).then(() => window.location.href = '/login');
    }
</script>
</body>
</html>
